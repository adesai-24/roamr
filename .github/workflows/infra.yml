# Validates the Kubernetes path that infra/ describes.
#
# Nothing here deploys anything -- roamr ships to Vercel today (see
# infra/README.md). The point is that the chart and manifests stay genuinely
# applyable, so the eventual cutover is a config change rather than a
# rediscovery of every mistake at once. A chart that has never been rendered is
# not a migration plan.
#
# Scoped to infra/** and this file so it does not add latency to unrelated PRs.
name: Infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Kubernetes API version the manifests are validated against. Keep in step
  # with Chart.yaml's kubeVersion floor and with whatever a real cluster would
  # run.
  KUBERNETES_VERSION: "1.31.0"
  CHART: infra/helm/roamr-web

jobs:
  helm:
    name: Helm lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install kubeconform
        run: |
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: helm lint (defaults)
        run: helm lint "$CHART"

      # ci/full-values.yaml turns on Ingress, the HPA, the NetworkPolicy and the
      # Secret reference. Without this pass those four templates would never be
      # rendered by CI at all, and a syntax error in them would reach a cluster
      # before anyone noticed.
      - name: helm lint (all features enabled)
        run: helm lint "$CHART" --values "$CHART/ci/full-values.yaml"

      - name: helm template + kubeconform (defaults)
        run: |
          helm template roamr "$CHART" \
            | kubeconform \
                -strict \
                -summary \
                -kubernetes-version "$KUBERNETES_VERSION" \
                -schema-location default \
                -schema-location \
                  'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: helm template + kubeconform (all features enabled)
        run: |
          helm template roamr "$CHART" --values "$CHART/ci/full-values.yaml" \
            | kubeconform \
                -strict \
                -summary \
                -kubernetes-version "$KUBERNETES_VERSION" \
                -schema-location default \
                -schema-location \
                  'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      # The chart guards against a PodDisruptionBudget on a single replica,
      # because such a PDB either blocks node drains forever or permits total
      # downtime. Assert the guard actually fires -- a `fail` that stopped
      # working would be invisible otherwise.
      - name: Single-replica PodDisruptionBudget is rejected
        run: |
          if helm template roamr "$CHART" --set replicaCount=1 > /dev/null 2>&1; then
            echo "::error::Expected the chart to reject a PDB with replicaCount=1, but it rendered."
            exit 1
          fi
          echo "Guard fired as expected."

      # The whole security posture rests on these. An accidental `--set` default
      # or a dropped block would leave pods running as root on a writable root
      # filesystem, and every other check here would still pass.
      - name: Rendered pods satisfy the restricted Pod Security Standard
        run: |
          rendered=$(helm template roamr "$CHART" --values "$CHART/ci/full-values.yaml")
          for expected in \
            "runAsNonRoot: true" \
            "runAsUser: 1001" \
            "allowPrivilegeEscalation: false" \
            "readOnlyRootFilesystem: true" \
            "type: RuntimeDefault"
          do
            if ! grep -qF "$expected" <<<"$rendered"; then
              echo "::error::Rendered manifests are missing: $expected"
              exit 1
            fi
          done
          echo "Security context assertions passed."

      # Liveness must never touch Supabase; readiness must. Getting these
      # backwards turns a brief upstream blip into a cluster-wide
      # CrashLoopBackOff, and it renders and validates perfectly either way --
      # which is exactly why it needs an explicit assertion rather than a
      # comment.
      - name: Liveness probes stay dependency-free
        run: |
          rendered=$(helm template roamr "$CHART")
          liveness=$(yq '.spec.template.spec.containers[0].livenessProbe.httpGet.path' <<<"$rendered" | grep -v '^---$' | grep -v null | head -1)
          readiness=$(yq '.spec.template.spec.containers[0].readinessProbe.httpGet.path' <<<"$rendered" | grep -v '^---$' | grep -v null | head -1)
          startup=$(yq '.spec.template.spec.containers[0].startupProbe.httpGet.path' <<<"$rendered" | grep -v '^---$' | grep -v null | head -1)
          echo "liveness=$liveness readiness=$readiness startup=$startup"
          [ "$liveness"  = "/healthz" ] || { echo "::error::livenessProbe must target /healthz (no dependencies), got '$liveness'"; exit 1; }
          [ "$readiness" = "/readyz"  ] || { echo "::error::readinessProbe must target /readyz, got '$readiness'"; exit 1; }
          [ "$startup"   = "/healthz" ] || { echo "::error::startupProbe must target /healthz, got '$startup'"; exit 1; }

  kustomize:
    name: Kustomize overlays
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        overlay: [staging, production]
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize and kubeconform
        run: |
          curl -sSfL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kustomize
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kustomize version
          kubeconform -v

      - name: kustomize build + kubeconform (${{ matrix.overlay }})
        run: |
          kustomize build "infra/k8s/overlays/${{ matrix.overlay }}" \
            | kubeconform \
                -strict \
                -summary \
                -kubernetes-version "$KUBERNETES_VERSION" \
                -schema-location default \
                -schema-location \
                  'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      # The base deliberately leaves the image as a bare `roamr-web` placeholder
      # so each overlay owns the tag. If someone adds an `images:` transformer to
      # the base, the overlay's transformer stops matching and silently deploys
      # the base's tag instead -- a real outage that produces a green build.
      - name: Overlay resolves the image placeholder (${{ matrix.overlay }})
        run: |
          image=$(kustomize build "infra/k8s/overlays/${{ matrix.overlay }}" \
            | yq '.spec.template.spec.containers[0].image' | grep -v null | grep -v '^---$' | head -1)
          echo "image=$image"
          case "$image" in
            ghcr.io/adesai-24/roamr-web:*|ghcr.io/adesai-24/roamr-web@sha256:*) ;;
            *) echo "::error::Overlay did not resolve the image placeholder; got '$image'"; exit 1 ;;
          esac
