# Local parity stack: the web app as it runs in production (container, non-root,
# standalone bundle) against the Supabase stack the CLI manages.
#
# `supabase start` owns Postgres/Auth/Storage on its own Docker network, so this
# file covers only the app and joins that network. Day-to-day development still
# uses `npm run dev` in web/ for hot reload -- this exists to catch the class of
# bug that only appears in a production build, before it reaches a cluster.
#
#   npx supabase start
#   docker compose up --build
services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # host.docker.internal lets the browser-side bundle reach the Supabase
        # API from inside the container on macOS and Windows.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://host.docker.internal:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY, see npx supabase status}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: roamr/web:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://host.docker.internal:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
