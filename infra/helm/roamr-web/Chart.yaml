apiVersion: v2
name: roamr-web
description: >-
  The stateless roamr Next.js web app. Postgres, Auth and Storage stay in
  Supabase Cloud, so this chart deliberately contains no stateful workloads.
type: application

# Chart version tracks changes to the templates themselves.
version: 0.1.0

# Default image tag when image.tag is unset. Bump alongside a release image.
appVersion: "0.1.0"

# autoscaling/v2 and PodDisruptionBudget policy/v1 are both stable from 1.21,
# but 1.27 is the floor for the `restricted` Pod Security Standard being
# enforced by default in the namespaces this is meant to run in.
kubeVersion: ">=1.27.0-0"

home: https://github.com/adesai-24/roamr
sources:
  - https://github.com/adesai-24/roamr

keywords:
  - nextjs
  - roamr
  - stateless

maintainers:
  - name: roamr
    url: https://github.com/adesai-24/roamr
