# Every optional feature switched on, so CI validates the templates a default
# render never reaches: Ingress, HPA, NetworkPolicy and the Secret reference.
# Excluded from the packaged chart by .helmignore -- this is test input, not
# something a consumer should install.
replicaCount: 3

image:
  repository: ghcr.io/adesai-24/roamr-web
  tag: "sha-0f1e2d3"

config:
  supabaseUrl: "https://abcdefghijklmnop.supabase.co"
  supabaseAnonKey: "ci-placeholder-anon-key"
  siteUrl: "https://roamr.example.com"
  extraEnv:
    LOG_LEVEL: info

secret:
  existingSecret: roamr-web-credentials
  serviceRoleKeyKey: SUPABASE_SERVICE_ROLE_KEY
  mapboxTokenKey: MAPBOX_ACCESS_TOKEN

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hosts:
    - host: roamr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: roamr-web-tls
      hosts:
        - roamr.example.com

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true

commonLabels:
  environment: ci

podAnnotations:
  prometheus.io/scrape: "false"
