{{- if .Values.podDisruptionBudget.enabled -}}
{{- $replicas := ternary (int .Values.autoscaling.minReplicas) (int .Values.replicaCount) .Values.autoscaling.enabled -}}
{{- if lt $replicas 2 -}}
{{- fail "podDisruptionBudget.enabled requires at least 2 replicas (replicaCount, or autoscaling.minReplicas when autoscaling is on). With a single pod a PDB either blocks node drains indefinitely or permits total downtime -- neither is a disruption budget." -}}
{{- end -}}
{{- if and .Values.podDisruptionBudget.minAvailable .Values.podDisruptionBudget.maxUnavailable -}}
{{- fail "Set only one of podDisruptionBudget.minAvailable or podDisruptionBudget.maxUnavailable." -}}
{{- end -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "roamr-web.fullname" . }}
  labels:
    {{- include "roamr-web.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Bounds *voluntary* disruption only -- node drains, cluster upgrades,
  # descheduler evictions. It does not protect against a node dying, which is
  # what topologySpreadConstraints are for.
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "roamr-web.selectorLabels" . | nindent 6 }}
{{- end }}
