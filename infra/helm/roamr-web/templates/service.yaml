apiVersion: v1
kind: Service
metadata:
  name: {{ include "roamr-web.fullname" . }}
  labels:
    {{- include "roamr-web.labels" . | nindent 4 }}
  {{- with (mergeOverwrite (dict) .Values.commonAnnotations .Values.service.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # Named rather than numeric so the container port can move without
      # touching the Service.
      targetPort: http
      protocol: TCP
  selector:
    {{- include "roamr-web.selectorLabels" . | nindent 4 }}
