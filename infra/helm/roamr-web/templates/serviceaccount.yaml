{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "roamr-web.serviceAccountName" . }}
  labels:
    {{- include "roamr-web.labels" . | nindent 4 }}
  {{- with (mergeOverwrite (dict) .Values.commonAnnotations .Values.serviceAccount.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app talks only to Supabase over HTTPS; it never calls the Kubernetes API.
# Not projecting a token means a compromised container has no cluster
# credentials to steal.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
