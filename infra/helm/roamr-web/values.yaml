# Default values for roamr-web.
#
# This chart deploys ONLY the stateless Next.js app. Postgres, Auth and Storage
# live in Supabase Cloud and are reached over the network -- there is no
# database, no PVC and no StatefulSet here, and that split is the point: the
# thing that scales horizontally is separated from the thing that holds data.
#
# See infra/README.md for how this chart relates to the live Vercel deployment.

# -- Number of pods when autoscaling is disabled. Ignored once
# `autoscaling.enabled` is true (the HPA owns the replica count from then on,
# and leaving it set here would fight the controller on every upgrade).
replicaCount: 2

image:
  # -- Container registry and repository holding the image built from
  # `web/Dockerfile`. No image is published yet; see infra/README.md.
  repository: ghcr.io/adesai-24/roamr-web
  # -- Image tag. Defaults to the chart's appVersion when empty. Always deploy
  # an immutable tag (a git SHA), never `latest` -- with `latest` a pod
  # rescheduled onto a new node can silently pick up a different build than its
  # siblings are running.
  tag: ""
  # -- Digest, e.g. `sha256:abc...`. Takes precedence over `tag` when set.
  digest: ""
  pullPolicy: IfNotPresent

# -- Names of pre-existing `kubernetes.io/dockerconfigjson` secrets for private
# registries.
imagePullSecrets: []

# -- Override the generated chart name portion of resource names.
nameOverride: ""
# -- Override the full generated resource name.
fullnameOverride: ""

serviceAccount:
  # -- Create a dedicated ServiceAccount rather than using `default`. The app
  # never calls the Kubernetes API, so its token is not mounted.
  create: true
  # -- Name to use. Generated from the fullname when empty.
  name: ""
  # -- Annotations for the ServiceAccount, e.g. an IRSA / Workload Identity
  # binding if the app ever needs cloud IAM.
  annotations: {}
  # -- Mount a Kubernetes API token into the pod. The app has no reason to talk
  # to the API server, so this stays false.
  automountServiceAccountToken: false

# ---------------------------------------------------------------------------
# Configuration
# ---------------------------------------------------------------------------
#
# IMPORTANT -- build time vs. runtime.
#
# Next inlines `process.env.NEXT_PUBLIC_*` into the client bundle during
# `next build` (see the ARG lines in web/Dockerfile). Setting them here does NOT
# change what the browser sees: to point the client at a different Supabase
# project you must rebuild the image with different build args.
#
# They are still set at runtime because `web/src/lib/env.ts` validates the full
# server schema from `process.env` on first use -- server-side code reads the
# same variables from the environment, and a pod without them fails its own
# readiness check. So the values below must MATCH the ones the image was built
# with. A mismatch is silent: the browser talks to one project and the server to
# another.
config:
  # -- Supabase project URL. Must match the image's build arg.
  supabaseUrl: "https://your-project.supabase.co"
  # -- Supabase anon key. Public by design -- row level security, not secrecy,
  # is what protects data behind it -- so it lives in a ConfigMap, not a Secret.
  # Must match the image's build arg.
  supabaseAnonKey: ""
  # -- Public origin users browse. Used to build magic-link redirect URLs, so a
  # wrong value sends people to the wrong host after login. Must match the
  # image's build arg.
  siteUrl: "https://roamr.example.com"
  # -- NODE_ENV for the container.
  nodeEnv: "production"
  # -- Extra plain (non-secret) environment variables, as a map.
  extraEnv: {}
  # -- Extra `envFrom` sources (ConfigMaps or Secrets) mounted wholesale.
  extraEnvFrom: []

secret:
  # -- Name of an EXISTING Secret holding the server-only credentials. This
  # chart never creates a Secret and never accepts a secret value in
  # values.yaml, because values files end up in git, in `helm get values` output
  # and in CI logs. Create it out of band:
  #
  #   kubectl create secret generic roamr-web \
  #     --from-literal=SUPABASE_SERVICE_ROLE_KEY=... \
  #     --from-literal=MAPBOX_ACCESS_TOKEN=...
  #
  # Leaving this empty renders a Deployment WITHOUT the service role key, which
  # will fail `web/src/lib/env.ts` validation at runtime. It is allowed only so
  # the chart can be linted and rendered in CI with no cluster present.
  existingSecret: ""
  # -- Key inside `existingSecret` holding SUPABASE_SERVICE_ROLE_KEY. This key
  # bypasses row level security; it is server-only and must never be exposed as
  # a NEXT_PUBLIC_ variable or a Docker build arg.
  serviceRoleKeyKey: "SUPABASE_SERVICE_ROLE_KEY"
  # -- Key inside `existingSecret` holding MAPBOX_ACCESS_TOKEN. Optional --
  # leave empty to omit the variable entirely.
  mapboxTokenKey: ""

service:
  type: ClusterIP
  # -- Port the Service listens on.
  port: 80
  # -- Container port. Matches `PORT` in web/Dockerfile.
  targetPort: 3000
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  # -- Annotations for the Ingress, e.g. cert-manager's
  # `cert-manager.io/cluster-issuer` to have TLS issued automatically.
  annotations: {}
  hosts:
    - host: roamr.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- TLS blocks. Each `secretName` must reference a Secret that exists or that
  # cert-manager will create.
  tls: []
  #  - secretName: roamr-web-tls
  #    hosts:
  #      - roamr.example.com

# ---------------------------------------------------------------------------
# Probes
# ---------------------------------------------------------------------------
#
# The distinction between these two endpoints is load-bearing, and getting it
# backwards is the classic way to turn a brief Supabase blip into a cluster-wide
# outage. See web/src/app/healthz/route.ts and web/src/app/readyz/route.ts.
#
#   /healthz  -- liveness. Zero dependencies; answers if the process is alive.
#   /readyz   -- readiness. Validates config and pings Supabase.
#
# Liveness must NOT touch Supabase. If it did, a Supabase hiccup would fail the
# liveness probe on every pod at once, kubelet would kill and restart all of
# them, and the restarts would keep failing while the dependency was down --
# converting a recoverable upstream problem into a CrashLoopBackOff. Readiness
# failing is the correct response instead: pods are pulled from the Service
# endpoints, stay running, and rejoin the moment Supabase answers again.
probes:
  liveness:
    enabled: true
    # -- Liveness path. Keep this dependency-free; see the note above.
    path: /healthz
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  readiness:
    enabled: true
    # -- Readiness path. This one is allowed -- and expected -- to check
    # Supabase.
    path: /readyz
    initialDelaySeconds: 0
    periodSeconds: 10
    # /readyz gives its Supabase fetch a 3s AbortSignal timeout, so the probe
    # timeout has to sit above that or the probe would fail before the handler
    # could report the failure itself.
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  # A cold Next.js start on a throttled CPU can take longer than the liveness
  # probe's budget. The startup probe suppresses liveness and readiness until it
  # passes once, so a slow boot is never mistaken for a crash loop. Budget here
  # is failureThreshold * periodSeconds = 60s.
  startup:
    enabled: true
    path: /healthz
    initialDelaySeconds: 3
    periodSeconds: 2
    timeoutSeconds: 3
    failureThreshold: 30

# ---------------------------------------------------------------------------
# Resources and scheduling
# ---------------------------------------------------------------------------
#
# Requests are what the scheduler packs against; the CPU limit is deliberately
# omitted by default because CFS throttling on a latency-sensitive Node process
# hurts p99 more than the noisy-neighbour risk it prevents. The memory limit is
# set, since memory is not compressible.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  # -- Target average CPU utilisation, as a percentage of the CPU *request*.
  targetCPUUtilizationPercentage: 70
  # -- Target average memory utilisation. Left empty by default: Node's heap
  # grows to fill what it is given and rarely shrinks, so memory is a poor
  # scale-out signal and a good way to get stuck at maxReplicas.
  targetMemoryUtilizationPercentage: ""
  # -- HPA v2 scaling behaviour. Scale up fast, down slowly, so a traffic spike
  # is absorbed but a lull does not thrash the deployment.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

podDisruptionBudget:
  # -- Keeps voluntary disruptions (node drains, cluster upgrades) from taking
  # every replica at once. Meaningless at replicaCount 1 -- with one pod, any
  # PDB either blocks drains forever or permits full downtime.
  enabled: true
  minAvailable: 1
  # -- Set this instead of minAvailable if you prefer. Only one may be set.
  maxUnavailable: ""

# -- Rolling update tuning. `maxUnavailable: 0` means capacity never dips below
# the desired replica count during a deploy: a new pod must pass its readiness
# probe before an old one is removed.
updateStrategy:
  maxUnavailable: 0
  maxSurge: 1

# -- Time kubelet allows between SIGTERM and SIGKILL. Must exceed the preStop
# sleep plus the longest in-flight request.
terminationGracePeriodSeconds: 30

lifecycle:
  preStop:
    # -- Sleep before the server is signalled, so kube-proxy and the ingress
    # controller finish removing this pod from their endpoint lists. Without it
    # a rolling update returns a burst of 502s: endpoint removal and pod
    # termination are concurrent, not ordered.
    enabled: true
    sleepSeconds: 5

# -- Spread pods across failure domains. `ScheduleAnyway` rather than
# `DoNotSchedule` so a single-zone or single-node cluster still schedules
# instead of leaving pods Pending -- this is a preference, not a hard
# requirement.
topologySpreadConstraints:
  enabled: true
  constraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

# -- Extra pod-level scheduling knobs.
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
#
# These defaults satisfy the `restricted` Pod Security Standard with no
# exceptions. UID 1001 matches the `nextjs` user created in web/Dockerfile;
# changing one without the other makes the container fail to read its own files.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  privileged: false
  # An immutable root filesystem turns an arbitrary-write bug into a failed
  # write instead of a persistent backdoor. It only works because every path the
  # app actually writes to is an emptyDir; see `writableVolumes` below.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Writable tmpfs-style mounts required because `readOnlyRootFilesystem` is
# on. Next.js writes its ISR/fetch cache under `.next/cache`, and Node and
# sharp both use `/tmp`; without these the container crash-loops on the first
# write. Sizes are capped so a runaway cache cannot exhaust node ephemeral
# storage.
writableVolumes:
  nextCache:
    enabled: true
    mountPath: /app/.next/cache
    sizeLimit: 512Mi
  tmp:
    enabled: true
    mountPath: /tmp
    sizeLimit: 64Mi

networkPolicy:
  # -- Default-deny for this pod, with explicit allowances below. Requires a CNI
  # that enforces NetworkPolicy (Cilium, Calico); on one that does not, this
  # object is accepted and silently ignored.
  enabled: false
  # -- Namespaces allowed to reach the pod on the container port. Typically the
  # ingress controller's namespace.
  ingressFromNamespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
  # -- Additional ingress rules appended verbatim.
  extraIngress: []
  egress:
    # -- Allow DNS to kube-dns/CoreDNS. Without this nothing resolves, including
    # the Supabase hostname.
    dns: true
    # -- Allow outbound HTTPS. Supabase Cloud, Mapbox and any other upstream are
    # all off-cluster over 443, so the app cannot function without it.
    https: true
  # -- Additional egress rules appended verbatim.
  extraEgress: []

# -- Extra labels and annotations applied to every rendered object.
commonLabels: {}
commonAnnotations: {}

# -- Extra pod-only labels and annotations, e.g. a service mesh opt-in.
podLabels: {}
podAnnotations: {}

# -- Extra volumes and volume mounts beyond the writable ones above.
extraVolumes: []
extraVolumeMounts: []
