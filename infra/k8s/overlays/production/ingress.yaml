apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roamr-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Photo uploads are the one large-body path in the app; nginx's 1m default
    # would reject a normal phone photo.
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx
  tls:
    - secretName: roamr-web-tls
      hosts:
        - roamr.example.com
  rules:
    - host: roamr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # namePrefix from the overlay rewrites this reference too, so it
                # resolves to prod-roamr-web after the build.
                name: roamr-web
                port:
                  number: 80
