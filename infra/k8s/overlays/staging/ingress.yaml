apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roamr-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx
  tls:
    - secretName: roamr-web-tls
      hosts:
        - staging.roamr.example.com
  rules:
    - host: staging.roamr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # namePrefix from the overlay rewrites this reference too, so it
                # resolves to staging-roamr-web after the build.
                name: roamr-web
                port:
                  number: 80
